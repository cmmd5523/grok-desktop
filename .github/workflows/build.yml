name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle renderer
        run: npm run build

      - name: Package NSIS installer
        # --publish never: CI has no GH_TOKEN and we upload artifacts manually.
        run: npx electron-builder --win nsis --publish never
        env:
          # No code-signing certificate on CI: disable auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: grokdesktop-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
